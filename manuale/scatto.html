<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Scatto manuale</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#fff}iframe{border:0;display:block}</style></head>
<body>
<!-- Regia per le schermate del manuale: ?s=<scena>. Apre l'app, carica l'esempio e la porta allo stato voluto. -->
<iframe id="f" src="../index.html"></iframe>
<script>
const scena = new URLSearchParams(location.search).get('s') || 'crea_cerca';
const f = document.getElementById('f');
const [W, H] = (new URLSearchParams(location.search).get('v') || '390x844').split('x');
f.style.width = W + 'px'; f.style.height = '100vh';
const wait = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  const w = f.contentWindow, d = w.document, q = x => d.querySelector(x);
  const inp = (el, v) => { el.value = v; el.dispatchEvent(new Event('input')); };
  const enter = (el, v) => { el.value = v; el.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter'})); };
  const tab = t => q(`nav [data-tab=${t}]`).click();
  const apriRossi = () => { tab('consegna'); inp(q('#cerca'), 'rossi'); q('#ordini .ord').click(); };
  d.documentElement.dataset.theme = 'light';   // il manuale si stampa: tema chiaro
  w.beep = () => {};
  q('#demo').click();                       // Mario Rossi (4 colli) e Giulia Bianchi (4 colli)
  w.nuovoCliente('Anna Verdi', 'Zafferana Etnea, via Roma 3', 'V-12'); w.save();
  switch (scena) {
    case 'crea_cerca': tab('arrivo'); inp(q('#cliCerca'), 'ros'); break;
    case 'crea_nuovo': tab('arrivo'); inp(q('#cliCerca'), 'Luca Neri'); q('#cliNuovoBtn').click();
      q('#fIndirizzo').value = 'Giarre, via Callipoli 40'; q('#fOrdine').value = 'N-31'; q('#fCliente').blur(); break;
    case 'crea_articoli': tab('arrivo'); w.scegli('C1');
      q('.rArt').value = 'Poltrona relax'; q('.rN').value = 2; q('.rUbi').value = 'A-04'; q('.rN').dispatchEvent(new Event('input'));
      q('#cliScelto').scrollIntoView(); w.scrollBy(0, -20); break;
    case 'crea_pronte': tab('arrivo'); w.scegli('C1');
      q('.rArt').value = 'Poltrona relax'; q('.rN').value = 2; q('.rUbi').value = 'A-04'; q('#crea').click();
      await wait(200); q('#creati').scrollIntoView(); break;
    case 'etichetta': tab('arrivo'); w.scegli('C1');
      q('.rArt').value = 'Poltrona relax'; q('.rN').value = 1; q('.rUbi').value = 'A-04'; q('#crea').click(); await wait(200);
      const lab = q('#anteprima .lab').outerHTML;
      d.querySelectorAll('header,main,footer').forEach(e => e.remove());
      d.body.style.background = '#fff'; d.body.insertAdjacentHTML('afterbegin', `<div style="padding:12px">${lab}</div>`);
      d.querySelector('.lab').style.border = '1px solid #D9CFC3'; break;
    case 'mag_collo': tab('magazzino'); enter(q('#magCerca'), 'RDM00002'); break;
    case 'mag_scaffale': tab('magazzino'); enter(q('#magCerca'), 'B02'); break;
    case 'cons_cerca': tab('consegna'); inp(q('#cerca'), 'rossi'); break;
    case 'cons_lista': apriRossi(); enter(q('#scan'), 'RDM00001'); enter(q('#scan'), 'RDM00002'); w.scrollTo(0, 0); break;
    case 'cons_errore': apriRossi(); enter(q('#scan'), 'RDM00001'); enter(q('#scan'), 'RDM00002'); enter(q('#scan'), 'RDM00006');
      q('#pkCount').scrollIntoView(); w.scrollBy(0, -10); break;
    case 'cons_camera': apriRossi(); ['RDM00001', 'RDM00002', 'RDM00003'].forEach(c => enter(q('#scan'), c));
      q('#camSheet').classList.remove('hide'); q('#camCount').textContent = '3/4 colli';
      q('#camMsg').className = 'cam-msg ok'; q('#camMsg').textContent = q('#scanMsg').textContent;
      // illustrazione del mirino: il codice del collo inquadrato
      q('#camReader').innerHTML = '<div style="position:relative;width:100%;height:100%;background:linear-gradient(160deg,#5b4a3c,#2a221c);display:flex;align-items:center;justify-content:center"><div style="background:#fff;padding:18px 18px 10px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.5)"><svg id="bcx"></svg></div><div style="position:absolute;left:8%;right:8%;top:38%;height:24%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)"></div></div>';
      w.JsBarcode(q('#bcx'), 'RDM00003', {format:'CODE128', height:70, fontSize:18, margin:0, font:'Inter', fontOptions:'bold'}); break;
    case 'cons_pronto': apriRossi(); ['RDM00001', 'RDM00002', 'RDM00003', 'RDM00004'].forEach(c => enter(q('#scan'), c));
      w.scrollTo(0, 0); break;
  }
  await wait(300);
  document.title = 'pronto';
};
</script>
</body></html>
